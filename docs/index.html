<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frågesport</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="spelare.js"></script>
</head>
<body>
  <main>
    <section id="anslut" hidden>
      <h1>Frågesport</h1>
      <form id="anslutform">
        <input id="kod" class="kodfalt" placeholder="KOD" maxlength="5" required
               autocomplete="off" autocapitalize="characters" spellcheck="false">
        <input id="namn" placeholder="Ditt namn" maxlength="20" required autocomplete="off">
        <button>Gå med</button>
      </form>
      <p id="fel" class="fel"></p>
    </section>

    <section id="vantar" hidden>
      <p>Du är med som</p>
      <h1 id="mittnamn"></h1>
      <p class="antal">Väntar på att spelet ska börja …</p>
      <button id="lamna" class="diskret">Lämna</button>
    </section>

    <section id="fraga" hidden>
      <p id="mobilfraga" class="mobilfraga"></p>
      <img id="mobilbild" class="mobilbild" alt="" hidden>
      <div id="svarsknappar" class="svarsknappar"></div>
      <form id="nummerform" class="nummerform" hidden>
        <input id="nummerinput" type="number" inputmode="decimal" step="any" required placeholder="Ditt svar">
        <button>Svara</button>
      </form>
    </section>

    <section id="svarat" hidden>
      <h1>Svar skickat!</h1>
      <p class="antal">Väntar på de andra …</p>
      <p id="svarfel" class="fel"></p>
    </section>

    <section id="facit" hidden>
      <h1 id="facitrubrik"></h1>
      <p id="facitpoang" class="facitpoang"></p>
      <p id="facitdetalj"></p>
      <p id="facitstatus" class="antal"></p>
    </section>

    <section id="slut" hidden>
      <p>Du kom på plats</p>
      <h1 id="slutplacering" class="slutplacering"></h1>
      <p id="slutpoang" class="antal"></p>
      <button id="nyttspel">Gå med i ett nytt spel</button>
    </section>
  </main>
</body>
</html>
