<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frågesport – värd</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="vard.js"></script>
</head>
<body class="vard">
  <main>
    <section id="login" hidden>
      <h1>Logga in som värd</h1>
      <form id="loginform">
        <input type="email" id="epost" placeholder="E-post" required autocomplete="username">
        <input type="password" id="losen" placeholder="Lösenord" required autocomplete="current-password">
        <button>Logga in</button>
      </form>
      <p id="loginfel" class="fel"></p>
    </section>

    <section id="start" hidden>
      <h1>Frågesport</h1>
      <button id="skapa">Skapa rum</button>
      <button id="loggaut" class="diskret">Logga ut</button>
      <p id="startfel" class="fel"></p>
    </section>

    <section id="lobby" hidden>
      <div class="anslutning">
        <div id="qr" class="qr"></div>
        <div class="koddel">
          <p class="instruktion">Skanna, eller gå till <strong id="adress"></strong> och skriv koden</p>
          <p id="kod" class="kod"></p>
        </div>
      </div>
      <p id="antal" class="antal"></p>
      <ul id="spelarlista" class="spelarlista"></ul>
      <div class="startrad">
        <select id="quizval"></select>
        <button id="starta">Starta</button>
      </div>
      <p id="lobbyfel" class="fel"></p>
      <button id="avsluta" class="diskret">Avsluta rum</button>
    </section>

    <section id="spel" hidden>
      <div class="fragehuvud">
        <span id="fragenr"></span>
        <span id="nedrakning" class="nedrakning"></span>
        <span id="svarsantal"></span>
      </div>
      <h1 id="fragetext" class="fragetext"></h1>
      <ol id="alternativ" class="alternativ"></ol>
      <div id="facitdel" hidden>
        <ol id="topplista" class="topplista"></ol>
        <button id="nasta">Nästa fråga</button>
      </div>
      <button id="visafacit" class="diskret">Visa svaret nu</button>
    </section>

    <section id="slut" hidden>
      <h1>Resultat</h1>
      <ol id="slutlista" class="topplista"></ol>
      <button id="klar">Avsluta</button>
    </section>
  </main>
</body>
</html>
